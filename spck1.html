    <style>
        .main {

            margin-top: 10px;

        }


        .carousel-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px;

        }

        .carousel {
            height: 750px;
            overflow: hidden;
            position: relative;
            z-index: 1;


            margin-top: 55px;




        }


        .keyboard {


            border-radius: 4%;
            overflow: hidden;

        }


        .keyboard img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        .navbar img {
            height: 40px;
            width: 76px;
        }

        .navbar {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1050 !important;
        }

        body {
            padding-top: 60px;
        }



        .video-container {
            width: 100%;
            overflow: hidden;
            border-radius: 30px;


        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .card {
            overflow: hidden;
        }

        .card img {
            width: 100%;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }


        .chu-tren-anh {
            position: absolute;

            /* Đưa chữ lên phía trên */
            top: 60px;

            /* Căn chính giữa */
            left: 50%;
            transform: translateX(-50%);

            /* Chữ */
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;

            /* Không cho chữ xuống nền */
            white-space: nowrap;
        }
    </style>
</head>
