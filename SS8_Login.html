<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Basic&family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lobster&display=swap"
        rel="stylesheet">

    <style>
        .lobster-regular h2 {
            text-align: center;
            font-family: 'Basic', Times, serif, sans-serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>

</head>

<body>
    <!-- d-flex là quan trọng nhất, không có cái này, mấy thuộc tính khác ko hoạt động -->
    <!--Display: Flex-->
    <!-- justify-content-center căn theo trục dọc-->
    <!-- algin-items-center căn theo trục ngang -->
    <!--min: tối thiểu, vh: viewport height - 100%-->
    <div class="d-flex justify-content-center align-items-center min-vh-100">

        <!-- BƯỚC 4: khung con, dùng CSS để giới hạn độ rộng -->
        <!--style="max-width: 400px; width: 100% , mặc định cao nhất là 400px-->
        <!--Nếu điện thoại mình, chiều rộng tối đa chỉ 320px, đúng = 320-->
        <div class="lobster-regular p-4 rounded shadow-sm"
            style="background-color: rgb(240, 235, 233) ;max-width: 400px; width: 100%;">
            <h2 class="mb-3">Đăng nhập</h2>
            <form action="/sub_mit/form" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Ex: tb@gmail.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ex: 123456">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input"  id="remember" name="remember">
                    <label for="remember" class="form-check-label">Remember Login?</label>
                </div>

                <button type="submit" class="btn btn-outline-dark w-100">Login</button>

                <p class="text-center mt-3 mb-0">Don't have an account yet? <a href="dangki.html">Register?</a></p>

            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
