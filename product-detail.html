    <!--   thong tin cac san pham     -->


    <script src="product.js"></script>

    <script> 
    


    // ==========================================
    // 1. LẤY ID DANH MỤC TỪ URL
    // ==========================================

    const params = new URLSearchParams(window.location.search);

    const categoryId = params.get("id");



    



    // ==========================================
    // 3. LẤY CONTAINER CHỨA CARD
    // ==========================================

    const cardContainer = document.getElementById("cardContainer");



    // ==========================================
    // 4. LẤY DANH SÁCH SẢN PHẨM CỦA CATEGORY
    // ==========================================

    const categoryProducts = products[categoryId];



    // ==========================================
    // 5. KIỂM TRA CATEGORY CÓ TỒN TẠI KHÔNG
    // ==========================================

    if (!categoryProducts) {

        cardContainer.innerHTML = `
            <p>Không tìm thấy sản phẩm.</p>
        `;

    } else {


        // ======================================
        // 6. TẠO CARD CHO TỪNG SẢN PHẨM
        // ======================================

        categoryProducts.forEach(product => {


            // Tạo một div
            const card = document.createElement("div");


            // Gắn class card
            card.classList.add("card");



            // ==================================
            // ĐƯA DỮ LIỆU VÀO CARD
            // ==================================

            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div class="card-body">


                    <h5>
                        ${product.name}
                    </h5>


                    <div class="rating">

                        <span class="stars">
                            ★★★★★
                        </span>

                        <span class="review">
                            (${product.review})
                        </span>

                    </div>


                    <p class="price">
                        $${product.price.toFixed(2)}
                    </p>


                    <a href="mua.html?id=${product.id}">  
                        <button>
                            Mua ngay
                        </button>
                    </a>


                </div>

            `;



            // ==================================
            // ĐƯA CARD VÀO CONTAINER
            // ==================================

            cardContainer.appendChild(card);

        });

    }
    

</script>
