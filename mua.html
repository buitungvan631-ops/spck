        .product-detail {
            display: flex;
            gap: 60px;

        /* BÊN TRÁI */
        .product-left {
            width: 50%;

            justify-content: center;
            align-items: flex-start;
        }

        .detail-image {
            width: 100%;
            max-width: 500px;
            height: 500px;
            object-fit: contain;

        /* BÊN PHẢI */
        .product-right {

            padding: 20px;
        }

        .product-right h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .detail-rating {
            color: #ffad00;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .detail-rating span {
            color: #555;
            font-size: 14px;
        }

        .detail-price {
            color: #e60000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .detail-description {
            font-size: 16px;
            line-height: 1.6;
            color: #444;

        /* MÀU */
        .color-section {
            margin-top: 25px;
        }

        .color-section h3 {

        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-option {
            padding: 10px 20px;
            border: 1px solid #aaa;
            border-radius: 20px;
            background: white;
            cursor: pointer;
        }

        .color-option:hover {
            border-color: #111;
        }

        .color-option.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* SỐ LƯỢNG */
        .quantity {
            display: flex;
            align-items: center;
            margin-top: 25px;
            gap: 15px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: 1px solid #aaa;
            background: white;
            cursor: pointer;
        }

        #quantity {
            font-size: 18px;
        }

        /* NÚT */
        .detail-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .detail-buttons button {
            flex: 1;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-cart {
            background: white;
            border: 1px solid #111;
        }

        .buy-now {
            background: #111;
            color: white;
            border: 1px solid #111;
        }

        .add-cart:hover {
            background: #eee;
        }

        .buy-now:hover {
            background: #333;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: 1px solid #aaa;
            background: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #111;
            color: white;
        }

        #quantity {
            width: 60px;
            height: 35px;
            box-sizing: border-box;

            border: 1px solid #aaa;
            text-align: center;
            font-size: 16px;
        }


        /* TẠM TÍNH */
        .subtotal {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 20px;
            padding-top: 20px;

            border-top: 1px solid #ddd;

            font-size: 18px;
        }

        #subtotalPrice {
            font-size: 22px;
            color: #e60000;
        }

<div class="product-detail">

    <!-- BÊN TRÁI -->
    <div class="product-left">
        <img id="detailImage" class="detail-image" alt="">
    </div>


    <!-- BÊN PHẢI -->
    <div class="product-right">

        <h1 id="detailName"></h1>

        <div class="detail-rating">
            ★★★★★
            <span id="detailReview"></span>
        </div>

        <div id="detailPrice" class="detail-price"></div>

        <p id="detailDescription" class="detail-description"></p>


        <!-- SỐ LƯỢNG -->
        <div class="quantity">
            <button id="minusBtn">−</button>

            <input type="number" id="quantity" value="1" min="1">

            <button id="plusBtn">+</button>
        </div>

        <!-- TẠM TÍNH -->
        <div class="subtotal">
            <span>Tạm tính:</span>
            <strong id="subtotalPrice"></strong>
        </div>


        <!-- NÚT -->
        <div class="detail-buttons">

            <button id="addCartBtn" class="add-cart">
                Thêm vào giỏ hàng
            </button>

            <button id="buyBtn" class="buy-now">
                Mua ngay
            </button>

        </div>

    </div>

<script src="product.js"></script>


<script>
    const params = new URLSearchParams(window.location.search);

    const productId = Number(params.get("id"));


    // Tìm sản phẩm
    let product = null;

    for (const category of Object.values(products)) {

        const found = category.find(item => item.id === productId);

        if (found) {
            product = found;
            break;
        }
    }


    // Không tìm thấy sản phẩm
    if (!product) {

        document.querySelector(".product-detail").innerHTML = `
        <h2>Không tìm thấy sản phẩm</h2>
    `;

    } else {

        // =========================
        // HIỂN THỊ THÔNG TIN
        // =========================

        document.getElementById("detailImage").src = product.image;

        document.getElementById("detailImage").alt = product.name;

        document.getElementById("detailName").innerText = product.name;

        document.getElementById("detailPrice").innerText =
            "$" + product.price.toFixed(2);

        document.getElementById("detailReview").innerText =
            `(${product.review} đánh giá)`;

        document.getElementById("detailDescription").innerText =
            product.description;

        document.getElementById("buyBtn").addEventListener("click", () => {
            window.location.href =
                `dat-hang.html?id=${product.id}&quantity=${quantity}`;
        });

        document.getElementById("addCartBtn").addEventListener("click", () => {
            window.location.href =
                `gio-hang.html?id=${product.id}&quantity=${quantity}`;
        });



        let quantity = 1;

        const quantityInput = document.getElementById("quantity");
        const subtotalPrice = document.getElementById("subtotalPrice");


        // Cập nhật tạm tính
        function updateSubtotal() {

            const subtotal = product.price * quantity;

            quantityInput.value = quantity;

            subtotalPrice.innerText =
                "$" + subtotal.toFixed(2);
        }


        // Nút +
        document.getElementById("plusBtn").addEventListener("click", () => {

            quantity++;

            updateSubtotal();

        });


        // Nút -
        document.getElementById("minusBtn").addEventListener("click", () => {

            if (quantity > 1) {
                quantity--;
            }

            updateSubtotal();

        });


        // Người dùng tự nhập số
        quantityInput.addEventListener("input", () => {

            let value = parseInt(quantityInput.value);

            // Nếu nhập số hợp lệ
            if (!isNaN(value) && value >= 1) {

                quantity = value;

                updateSubtotal();
            }
        });


        // Khi người dùng xóa ô rồi click ra ngoài
        quantityInput.addEventListener("blur", () => {

            let value = parseInt(quantityInput.value);

            if (isNaN(value) || value < 1) {

                quantity = 1;

                updateSubtotal();
            }

        });


        // Hiển thị ban đầu
        updateSubtotal();

    }
</script>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
