            height: 40px;

            position: fixed !important;

            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            padding-bottom: 100px;
        }


        /* ==============================
           HEADER
        ============================== */

        .header {
            background: #111;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
        }


        /* ==============================
           CONTAINER
        ============================== */

        .cart-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }


        .cart-title {
            margin-bottom: 25px;
        }


        /* ==============================
           CARD SẢN PHẨM
        ============================== */

        .cart-item {
            width: 100%;
            min-height: 180px;

            background: white;

            border-radius: 12px;

            margin-bottom: 15px;
            padding: 20px;

            display: flex;
            align-items: center;

            gap: 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }


        /* ==============================
           CHECKBOX
        ============================== */

        .cart-checkbox {
            width: 22px;
            height: 22px;

            cursor: pointer;

            flex-shrink: 0;
        }


        /* ==============================
           ẢNH
        ============================== */

        .cart-image {
            width: 150px;
            height: 140px;

            object-fit: contain;

            flex-shrink: 0;
        }


        /* ==============================
           THÔNG TIN
        ============================== */

        .cart-info {
            flex: 1;
            min-width: 0;
        }


        .cart-name {
            margin: 0 0 12px;

            font-size: 20px;
        }


        .cart-price {
            color: #e60000;

            font-size: 19px;
            font-weight: bold;

            margin-bottom: 15px;
        }


        /* ==============================
           SỐ LƯỢNG
        ============================== */

        .quantity-control {
            display: flex;
            align-items: center;
        }


        .quantity-control button {
            width: 38px;
            height: 38px;

            border: 1px solid #ccc;

            background: white;

            font-size: 20px;

            cursor: pointer;
        }


        .quantity-control button:hover {
            background: #111;
            color: white;
        }


        .quantity-control input {
            width: 55px;
            height: 38px;

            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;

            border-left: 0;
            border-right: 0;

            text-align: center;

            font-size: 16px;
        }


        /* ==============================
           THÀNH TIỀN
        ============================== */

        .item-total {
            width: 150px;

            text-align: right;

            flex-shrink: 0;
        }


        .item-total span {
            display: block;

            color: #666;

            margin-bottom: 8px;
        }


        .item-total strong {
            color: #e60000;

            font-size: 20px;
        }


        /* ==============================
           XÓA
        ============================== */

        .delete-btn {
            margin-top: 12px;

            padding: 0;

            border: none;

            background: none;

            color: #888;

            cursor: pointer;
        }


        .delete-btn:hover {
            color: #e60000;
        }


        /* ==============================
           GIỎ TRỐNG
        ============================== */

        .empty-cart {
            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 12px;

            font-size: 20px;

            color: #666;
        }


        /* ==============================
           TASKBAR
        ============================== */

        .cart-taskbar {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            min-height: 80px;

            background: white;

            border-top: 1px solid #ddd;

            box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.08);

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px 40px;

            z-index: 1000;
        }


        .selected-info {
            font-size: 16px;
        }


        .selected-info strong {
            color: #e60000;
        }


        .taskbar-right {
            display: flex;

            align-items: center;

            gap: 25px;
        }


        .cart-total {
            font-size: 18px;
        }


        .cart-total strong {
            color: #e60000;

            font-size: 24px;
        }


        .buy-btn {
            border: none;

            border-radius: 25px;

            background: #111;

            color: white;

            padding: 14px 35px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }


        .buy-btn:hover {
            background: #333;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            .cart-item {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .cart-image {
                width: 110px;
                height: 110px;
            }

            .item-total {
                width: 100%;
                text-align: left;
            }

            .cart-taskbar {
                padding: 12px 15px;
            }

            .taskbar-right {
                gap: 10px;
            }

            .cart-total {
                font-size: 14px;
            }

            .cart-total strong {
                font-size: 18px;
            }

            .buy-btn {
                padding: 12px 18px;
            }

        }
    </style>
</head>

<!-- ==============================
         HEADER
    ============================== -->

<div class="header">
    
</div>


<!-- ==============================
         DANH SÁCH GIỎ HÀNG
    ============================== -->

<div class="cart-container">

    <h1 class="cart-title">
        Giỏ hàng của bạn
    </h1>

    <div id="cartList"></div>

</div>


<!-- ==============================
         TASKBAR
    ============================== -->

<div class="cart-taskbar">

    <div class="selected-info">

        Đã chọn:

        <strong id="selectedCount">
            0
        </strong>

        sản phẩm

    </div>


    <div class="taskbar-right">

        <div class="cart-total">

            Tổng tiền:

            <strong id="cartTotal">
                $0.00
            </strong>

        </div>


        <button id="buyBtn" class="buy-btn">
            Mua ngay
        </button>

    </div>

</div>



<!-- ==============================
         PRODUCTS.JS
    ============================== -->

<script src="product.js"></script>


<script>

    const params = new URLSearchParams(window.location.search);

const productId = Number(params.get("id"));
let quantity = Number(params.get("quantity")) || 1;

const cartList = document.getElementById("cartList");
const selectedCount = document.getElementById("selectedCount");
const cartTotal = document.getElementById("cartTotal");


/* ==============================
   TÌM SẢN PHẨM
============================== */

function findProduct(id) {
    for (const category of Object.values(products)) {
        const product = category.find(item => item.id === id);

        if (product) {
            return product;
        }
    }

    return null;
}


const product = findProduct(productId);


/* ==============================
   NẾU KHÔNG TÌM THẤY
============================== */

if (!product) {

    cartList.innerHTML = `
        <div class="empty-cart">
            Không tìm thấy sản phẩm.
        </div>
    `;

} else {

    renderCart();

}


/* ==============================
   HIỂN THỊ GIỎ HÀNG
============================== */

function renderCart() {

    const total = Number(product.price) * quantity;

    cartList.innerHTML = `

        <div class="cart-item">

            <input
                type="checkbox"
                id="productCheck"
                class="cart-checkbox"
                checked
            >

            <img
                class="cart-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="cart-info">

                <h2 class="cart-name">
                    ${product.name}
                </h2>

                <div class="cart-price">
                    $${Number(product.price).toFixed(2)}
                </div>


                <div class="quantity-control">

                    <button id="minusBtn">
                        −
                    </button>

                    <input
                        type="number"
                        id="quantityInput"
                        min="1"
                        value="${quantity}"
                    >

                    <button id="plusBtn">
                        +
                    </button>

                </div>


                <button
                    id="deleteBtn"
                    class="delete-btn"
                >
                    Xóa khỏi giỏ hàng
                </button>

            </div>


            <div class="item-total">

                <span>
                    Thành tiền
                </span>

                <strong id="itemTotal">
                    $${total.toFixed(2)}
                </strong>

            </div>

        </div>

    `;


    updateTotal();


    /* ==============================
       NÚT +
    ============================== */

    document.getElementById("plusBtn").addEventListener("click", () => {

        quantity++;

        updateURL();
        renderCart();

    });


    /* ==============================
       NÚT -
    ============================== */

    document.getElementById("minusBtn").addEventListener("click", () => {

        if (quantity > 1) {

            quantity--;

            updateURL();
            renderCart();

        }

    });


    /* ==============================
       NHẬP SỐ LƯỢNG
    ============================== */

    document.getElementById("quantityInput").addEventListener("change", (event) => {

        let value = Number(event.target.value);

        if (!Number.isInteger(value) || value < 1) {
            value = 1;
        }

        quantity = value;

        updateURL();
        renderCart();

    });


    /* ==============================
       XÓA SẢN PHẨM
    ============================== */

    document.getElementById("deleteBtn").addEventListener("click", () => {

        window.location.href = "gio-hang.html";

    });


    /* ==============================
       CHECKBOX
    ============================== */

    document
        .getElementById("productCheck")
        .addEventListener("change", updateTotal);

}


/* ==============================
   CẬP NHẬT URL
============================== */

function updateURL() {

    window.history.replaceState(
        {},
        "",
        `gio-hang.html?id=${product.id}&quantity=${quantity}`
    );

}


/* ==============================
   TÍNH TỔNG TIỀN
============================== */

function updateTotal() {

    const checkbox = document.getElementById("productCheck");

    if (!checkbox || !checkbox.checked) {

        selectedCount.innerText = "0";
        cartTotal.innerText = "$0.00";

        return;
    }


    const total = Number(product.price) * quantity;

    selectedCount.innerText = "1";

    cartTotal.innerText =
        "$" + total.toFixed(2);

}


/* ==============================
   NÚT MUA NGAY
============================== */

document.getElementById("buyBtn").addEventListener("click", () => {

    const checkbox =
        document.getElementById("productCheck");


    if (!checkbox || !checkbox.checked) {

        alert("Vui lòng chọn sản phẩm muốn mua!");

        return;
    }


    window.location.href =
        `dat-hang.html?id=${product.id}&quantity=${quantity}`;

});

</script>
